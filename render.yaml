# إعداد النشر على Render (New > Blueprint > اختر هذا المستودع)
services:
  - type: web
    name: notifications-dashboard
    runtime: node
    rootDir: server
    # الخطة المدفوعة الأرخص مطلوبة لأن الخطة المجانية لا تدعم القرص الدائم
    # (بدونه تُمسح بيانات الموظفين والأكواد مع كل إعادة تشغيل) وتنام بعد 15 دقيقة
    plan: starter
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /api/ping
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
