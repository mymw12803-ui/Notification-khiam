<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>منظومة الإشعارات</title>
<style>
  :root{--bg:#f8fafc;--card:#fff;--line:#e2e8f0;--text:#0f172a;--muted:#64748b;--brand:#2563eb;--brand2:#7c3aed;--ok:#16a34a;--bad:#dc2626;--warn:#d97706}
  *{box-sizing:border-box}
  body{margin:0;width:350px;background:var(--bg);color:var(--text);font:14px/1.6 "Segoe UI",Tahoma,Arial,sans-serif}
  body.page{width:auto;min-height:100vh;display:grid;place-items:center;padding:30px 16px;background:linear-gradient(135deg,#eef2ff,#f8fafc)}
  body.page .wrap{width:440px;max-width:100%;border-radius:18px;overflow:hidden;box-shadow:0 20px 50px rgba(15,23,42,.15)}
  .wrap{background:var(--bg)}
  header{display:flex;align-items:center;gap:10px;padding:14px 16px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff}
  header img{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.15)}
  header b{font-size:15.5px;display:block}
  header small{opacity:.85;font-size:12px}
  main{padding:14px 16px 6px;display:flex;flex-direction:column;gap:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .status{display:flex;align-items:center;gap:10px}
  .dot{width:11px;height:11px;border-radius:50%;background:#94a3b8;flex:none;box-shadow:0 0 0 4px #94a3b833}
  .dot.ok{background:var(--ok);box-shadow:0 0 0 4px #16a34a33}
  .dot.bad{background:var(--bad);box-shadow:0 0 0 4px #dc262633}
  .status b{display:block}
  .status small{color:var(--muted);display:block;font-size:12.5px}
  .pending{display:none;align-items:center;justify-content:space-between;gap:8px;background:#fef2f2;border-color:#fecaca;color:#991b1b}
  .pending.on{display:flex}
  label{display:block;font-size:12.5px;color:var(--muted);margin:8px 0 4px;font-weight:600}
  input,textarea{width:100%;font:inherit;padding:9px 11px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--text);outline:none}
  input:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px #2563eb22}
  input.ltr{direction:ltr;text-align:left}
  textarea{min-height:64px;resize:vertical}
  button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:9px 14px;cursor:pointer;background:var(--brand);color:#fff}
  button:hover{filter:brightness(1.07)}
  button.sec{background:#eef2ff;color:var(--brand)}
  button.red{background:var(--bad)}
  button:disabled{opacity:.5;cursor:default}
  .row{display:flex;gap:8px;align-items:center;margin-top:8px}
  .row button{flex:none}
  .msg{font-size:12.5px;min-height:18px}
  .msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
  details summary{cursor:pointer;font-weight:700;color:#334155;list-style:none;display:flex;align-items:center;justify-content:space-between}
  details summary::-webkit-details-marker{display:none}
  details summary::after{content:"⌄";color:var(--muted)}
  details[open] summary::after{content:"⌃"}
  footer{padding:8px 16px 14px;color:var(--muted);font-size:11.5px;text-align:center}
  h3{margin:0 0 4px;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="icons/icon48.png" alt="">
    <div><b>منظومة الإشعارات</b><small id="hello">إضافة الموظف</small></div>
  </header>
  <main>
    <div class="card status">
      <span class="dot" id="dot"></span>
      <div><b id="stText">...</b><small id="stSub"></small></div>
    </div>

    <div class="card pending" id="pending">
      <span id="pendingText"></span>
      <button class="red" id="showPending">عرضها</button>
    </div>

    <div class="card" id="toAdminCard">
      <h3>رسالة للإدارة</h3>
      <textarea id="toAdmin" placeholder="اكتب رسالتك للمدير..."></textarea>
      <div class="row">
        <button id="sendAdmin">إرسال</button>
        <span class="msg" id="adminMsg"></span>
      </div>
    </div>

    <details class="card" id="setup">
      <summary>إعدادات الربط</summary>
      <label for="server">عنوان الخادم</label>
      <input id="server" class="ltr" placeholder="https://dashboard.example.com" autocomplete="off">
      <label for="code">كود الموظف</label>
      <input id="code" class="ltr" placeholder="ABC123" autocomplete="off" style="text-transform:uppercase;letter-spacing:2px;font-weight:700">
      <div class="row">
        <button id="save">حفظ واتصال</button>
        <span class="msg" id="saveMsg"></span>
      </div>
    </details>
  </main>
  <footer>هذا المتصفح مرتبط بنظام متابعة العمل والإشعارات · <span id="ver"></span></footer>
</div>
<script src="popup.js"></script>
</body>
</html>
